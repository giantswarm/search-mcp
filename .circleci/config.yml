version: 2.1

orbs:
  architect: giantswarm/architect@6.12.0

workflows:
  build:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build
          binary: search-mcp
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-app-catalog:
          context: architect
          name: validate-chart
          requires:
            - go-build
          executor: app-build-suite
          chart: search-mcp
          push_to_appcatalog: false
          push_to_oci_registry: false # TODO: enable once this works
          app_catalog_test: dummy
          app_catalog: dummy

      - architect/push-to-registries:
          context: architect
          name: push-to-registries
          requires:
            - go-build
          registries-data: |-
              public gsoci.azurecr.io ACR_GSOCI_USERNAME ACR_GSOCI_PASSWORD true
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore:
                - main

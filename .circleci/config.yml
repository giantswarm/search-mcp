version: 2.1

orbs:
  architect: giantswarm/architect@6.11.0

workflows:
  build:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build
          binary: search-mcp
          filters:
            tags:
              only: /^v.*/

      - architect/push-to-registries:
          context: architect
          name: push-to-registries
          requires:
            - go-build
          registries-data: |-
              public gsoci.azurecr.io ACR_GSOCI_USERNAME ACR_GSOCI_PASSWORD true
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore:
                - main

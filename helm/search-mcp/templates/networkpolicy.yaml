apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "search-mcp.fullname" . }}
  labels:
    {{- include "search-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "search-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS lookups
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS to anywhere (external APIs, etc.)
    - ports:
        - protocol: TCP
          port: 443

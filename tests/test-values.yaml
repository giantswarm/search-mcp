# Values used by app-test-suite when installing the chart on the kind smoke
# cluster. The default chart renders a ServiceMonitor (Prometheus Operator
# CRD) and an HTTPRoute (Gateway API CRD); neither CRD exists on a bare kind
# cluster, so both are disabled here. A single replica is enough for the
# smoke test.
replicaCount: 1

serviceMonitor:
  enabled: false

route:
  enabled: false

# Pin the smoke-test image to a released tag. The chart otherwise defaults
# image.tag to .Chart.AppVersion, which the architect pipeline rewrites to a
# wall-clock dev version computed independently by build-chart and
# push-to-registries; those two timestamps can drift by seconds, so the chart
# can reference an image tag that was never pushed and the pod hangs in
# ImagePullBackOff. Pinning to a real released image makes the smoke deploy pull
# a tag that always exists.
image:
  tag: "0.3.0"

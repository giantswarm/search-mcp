# Values used by app-test-suite when installing the chart on the kind smoke
# cluster. The default chart renders a ServiceMonitor (Prometheus Operator
# CRD) and an HTTPRoute (Gateway API CRD); neither CRD exists on a bare kind
# cluster, so both are disabled here. A single replica is enough for the
# smoke test.
replicaCount: 1

serviceMonitor:
  enabled: false

route:
  enabled: false
  # values.schema.json requires route.hostnames (minItems 1) even when the
  # route is disabled, so supply a placeholder. With enabled: false no HTTPRoute
  # is rendered, so the Gateway API CRD is still not needed.
  hostnames:
    - search-mcp.test
